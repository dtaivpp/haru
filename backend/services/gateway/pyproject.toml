[project]
name = "haru-gateway"
version = "0.1.0"
description = "Haru terminal gateway (the backend the terminals connect to)"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "David Tippett" }]
dependencies = [
    "haru-protocol",
    "websockets>=15,<16",
    "httpx>=0.27,<1",
    "numpy>=2,<3",
    "onnxruntime>=1.20,<2",
    "tzdata",
    "google-auth>=2,<3",
    "requests>=2,<3",
    "mcp>=2.2,<3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Discover sub-packages automatically: an explicit list once left haru_gateway.tools
# out of the image, and the gateway crash-looped on deploy.
[tool.setuptools.packages.find]
include = ["haru_gateway*"]
